version: 2

sources:
  - name: staging
    database: analytics
    schema: staging
    tables:
      - name: hosts
        columns:
          - name: host_id
            tests: [unique, not_null]
      - name: listings
        columns:
          - name: listing_id
            tests: [unique, not_null]
      - name: bookings
        columns:
          - name: booking_id
            tests: [unique, not_null]